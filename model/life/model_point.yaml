kind: entity
name: model_point
domain: life
title: Model Point
description: >
  A grouped model point for life valuation: policies compressed into cohorts
  (attained age by outstanding term) at a valuation date. Model points are
  derived from in-force life policies; the grouping is proven back to the
  policy count and sum assured it represents.
grain: One row per cohort per line of business per valuation date.
tags:
  maturity: draft
attributes:
  - name: model_point_id
    type: string
    required: true
    description: Identifier for the model point.
    classification: internal
  - name: valuation_date
    type: date
    required: true
    description: Valuation date the model point file was cut at.
    classification: internal
  - name: line_of_business_code
    code_set: line_of_business
    required: true
    description: Life line of business the cohort belongs to.
    classification: internal
  - name: age_attained
    type: integer
    required: true
    description: Attained age of the cohort at the valuation date.
    classification: internal
  - name: outstanding_term_years
    type: integer
    required: true
    description: Remaining policy term of the cohort in whole years.
    classification: internal
  - name: policy_count
    type: integer
    required: true
    description: Number of in-force policies grouped into this model point.
    classification: internal
  - name: sum_assured
    type: decimal(18,2)
    required: true
    description: Total sum assured of the cohort, in the cohort currency.
    classification: confidential
  - name: annual_premium
    type: decimal(18,2)
    required: false
    description: Total annualised premium of the cohort.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the monetary amounts.
    classification: internal
  - name: source_system_code
    code_set: source_system
    required: true
    description: System of record the model point file originates from.
    classification: internal
keys:
  primary: [model_point_id]
quality:
  - name: grouping_proven
    rule: sum(policy_count) per valuation_date equals the in-force policy count it was cut from
    description: Model point grouping must reconcile exactly to the underlying book.
owner: Chief Actuary
