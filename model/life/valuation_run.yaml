kind: entity
name: valuation_run
domain: life
title: Valuation Run
description: >
  One execution of a valuation process: which valuation date, which approved
  assumption sets (one per assumption type, via valuation_run_assumption),
  which scenario set, which model version, run by whom, with what quality
  verdict. The run is the unit of auditability - every published valuation
  result points back to exactly one run.
grain: One row per valuation run execution.
tags:
  maturity: draft
attributes:
  - name: valuation_run_id
    type: string
    required: true
    description: Identifier for the run.
    classification: internal
  - name: legal_entity_id
    references: legal_entity
    type: string
    required: false
    description: >
      The legal entity the run values. With reporting_level this is what
      distinguishes a subsidiary's solo run from the group consolidated run.
    classification: internal
  - name: reporting_level_code
    code_set: reporting_level
    required: false
    description: Solo (this entity) or group (consolidated).
    classification: internal
  - name: reporting_regime_code
    code_set: reporting_regime
    required: false
    description: Regime the run is prepared under (Solvency II, IFRS 17...).
    classification: internal
  - name: valuation_date
    type: date
    required: true
    description: Valuation date the run values the book at.
    classification: internal
  - name: run_timestamp
    type: timestamp
    required: true
    description: When the run executed.
    classification: internal
  - name: scenario_set_id
    references: scenario_set
    type: string
    required: false
    description: Scenario set the run used, for stochastic runs.
    classification: internal
  - name: model_version
    type: string
    required: false
    description: Version of the valuation model/engine used (e.g. a Unity Catalog model version).
    classification: internal
  - name: run_verdict_code
    code_set: run_verdict
    required: true
    description: Quality-gate verdict; RED runs never feed published results.
    classification: internal
  - name: run_by
    type: string
    required: false
    description: Operator or service principal that executed the run.
    classification: internal
  - name: source_system_code
    code_set: source_system
    required: true
    description: System that executed the run.
    classification: internal
keys:
  primary: [valuation_run_id]
owner: Chief Actuary
