kind: entity
name: treaty_layer
domain: reinsurance
title: Treaty Layer
description: >
  A layer of a treaty programme: limit and attachment for non-proportional
  forms, with reinstatement terms where they apply. Proportional treaties
  typically have a single layer carrying the ceded share economics on the
  treaty itself.
grain: One row per layer per treaty.
standards:
  acord: Layer / section patterns (ACORD GRLC)
tags:
  maturity: draft
attributes:
  - name: treaty_layer_id
    type: string
    required: true
    description: Identifier for the layer.
    classification: internal
  - name: treaty_id
    references: treaty
    type: string
    required: true
    description: Treaty the layer belongs to.
    classification: internal
  - name: layer_number
    type: integer
    required: true
    description: Position of the layer in the programme, 1 = lowest attachment.
  - name: limit_amount
    type: decimal(18,2)
    required: true
    description: Limit of the layer, in the treaty currency.
    classification: confidential
  - name: attachment_amount
    type: decimal(18,2)
    required: false
    description: Attachment point of the layer; empty for proportional forms.
    classification: confidential
  - name: reinstatement_count
    type: integer
    required: false
    description: Number of reinstatements available, where applicable.
  - name: reinstatement_premium_rate
    type: decimal(5,4)
    required: false
    description: Reinstatement premium as a fraction of the layer premium.
    classification: confidential
keys:
  primary: [treaty_layer_id]
