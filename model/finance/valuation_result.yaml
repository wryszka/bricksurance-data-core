kind: entity
name: valuation_result
domain: finance
title: Valuation Result
description: >
  A published valuation figure: one measure (BEL, technical provision, IBNR,
  SCR, CSM...) for one line of business and cohort, produced by exactly one
  auditable valuation run. One shape serves life and non-life, Solvency II
  and IFRS 17 - new regimes add measure codes, not tables.
grain: One row per valuation run per line of business per measure per cohort.
tags:
  maturity: draft
attributes:
  - name: valuation_result_id
    type: string
    required: true
    description: Identifier for the result row.
    classification: internal
  - name: valuation_run_id
    references: valuation_run
    type: string
    required: true
    description: The run that produced this figure.
    classification: internal
  - name: line_of_business_code
    code_set: line_of_business
    required: true
    description: Line of business the figure relates to.
  - name: valuation_measure_code
    code_set: valuation_measure
    required: true
    description: Which defined measure this figure is.
  - name: cohort
    type: string
    required: false
    description: Optional sub-division (e.g. an age-by-term band or underwriting-year cohort).
  - name: amount
    type: decimal(18,2)
    required: true
    description: The figure, in the stated currency. Sign follows the measure's own convention.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amount.
keys:
  primary: [valuation_result_id]
