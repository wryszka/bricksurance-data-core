kind: entity
name: receivable_transaction
domain: finance
title: Receivable Transaction
description: >
  Premium billing and collection movements on a policy. Written premium is
  earned exposure; this is the cash reality - outstanding and aged debt are
  signed sums over these rows.
grain: One row per billing movement per policy.
tags:
  maturity: draft
attributes:
  - name: receivable_transaction_id
    type: string
    required: true
    description: Identifier for the movement.
    classification: internal
  - name: policy_id
    references: policy
    type: string
    required: true
    description: Policy billed.
    classification: internal
  - name: legal_entity_id
    references: legal_entity
    type: string
    required: false
    description: The entity carrying the receivable.
    classification: internal
  - name: receivable_transaction_type_code
    code_set: receivable_transaction_type
    required: true
    description: Kind of movement; invoices positive, receipts negative.
    classification: internal
  - name: amount
    type: decimal(18,2)
    required: true
    description: Signed amount in the stated currency.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amount.
    classification: internal
  - name: transaction_date
    type: date
    required: true
    description: Booking date.
    classification: internal
  - name: due_date
    type: date
    required: false
    description: Payment due date, for invoices - the anchor for ageing.
    classification: internal
  - name: source_system_code
    code_set: source_system
    required: true
    description: System of record.
    classification: internal
keys:
  primary: [receivable_transaction_id]
owner: Financial Controller
