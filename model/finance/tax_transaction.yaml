kind: entity
name: tax_transaction
domain: finance
title: Tax Transaction
description: >
  A tax movement for a legal entity - insurance premium tax, corporation tax,
  deferred tax. IPT in particular is a real line on every premium; this makes
  the tax position queryable rather than buried.
grain: One row per tax movement per entity.
tags:
  maturity: draft
attributes:
  - name: tax_transaction_id
    type: string
    required: true
    description: Identifier for the movement.
    classification: internal
  - name: legal_entity_id
    references: legal_entity
    type: string
    required: true
    description: The entity the tax relates to.
    classification: internal
  - name: tax_type_code
    code_set: tax_type
    required: true
    description: Kind of tax.
  - name: policy_id
    references: policy
    type: string
    required: false
    description: Source policy, for premium tax.
    classification: internal
  - name: amount
    type: decimal(18,2)
    required: true
    description: Signed amount in the stated currency.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amount.
  - name: transaction_date
    type: date
    required: true
    description: Booking date.
  - name: source_system_code
    code_set: source_system
    required: true
    description: System of record.
    classification: internal
keys:
  primary: [tax_transaction_id]
