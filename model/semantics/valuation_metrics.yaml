kind: metric_view
name: valuation_metrics
domain: semantics
title: Valuation Metrics
description: >
  Published valuation figures (BEL, technical provisions, SCR, CSM...) by
  run, measure and line of business - one semantic surface across life and
  non-life, Solvency II and IFRS 17. Amounts are in original currency; group
  by or filter on currency_code and valuation_measure_code before summing.
  Query measures with MEASURE(name).
source: finance.valuation_result
joins:
  - name: valuation_run
    source: life.valuation_run
    condition: source.valuation_run_id = valuation_run.valuation_run_id
  - name: line_of_business
    source: reference.line_of_business
    condition: source.line_of_business_code = line_of_business.line_of_business_code
dimensions:
  - name: valuation_date
    expr: valuation_run.valuation_date
    description: Valuation date of the producing run.
  - name: valuation_measure_code
    expr: valuation_measure_code
    description: Which defined measure the figure is (BEL, SCR, CSM...). Always constrain this before summing.
  - name: line_of_business
    expr: line_of_business.label
    description: Line of business as its business label.
  - name: cohort
    expr: cohort
    description: Optional sub-division of the figure.
  - name: currency_code
    expr: currency_code
    description: Original currency. Group by this before summing money.
measures:
  - name: total_amount
    expr: SUM(amount)
    description: Sum of the figures - only meaningful within one measure and one currency.
  - name: run_count
    expr: COUNT(DISTINCT valuation_run_id)
    description: Number of distinct producing runs represented.
