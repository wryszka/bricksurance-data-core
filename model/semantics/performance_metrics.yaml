kind: metric_view
name: performance_metrics
domain: semantics
title: Performance Metrics
description: >
  The underwriting result: earned premium, incurred claims, expenses and the
  loss / expense / combined ratios - each defined once. Earning is
  straight-line daily; expenses are line-level, so combined ratio is
  meaningful per line and currency (not per underwriting year). Always
  constrain currency_code. Query measures with MEASURE(name).
source: semantics.underwriting_performance
joins:
  - name: line_of_business
    source: reference.line_of_business
    condition: source.line_of_business_code = line_of_business.line_of_business_code
dimensions:
  - name: line_of_business
    expr: line_of_business.label
    description: >
      Line of business as its business label, e.g. 'Commercial Property'.
      Filter with labels; use line_of_business_code for codes.
  - name: line_of_business_code
    expr: source.line_of_business_code
    description: Line of business as its code, e.g. COMMERCIAL_PROPERTY.
  - name: currency_code
    expr: currency_code
    description: Original currency. Always constrain before ratios or sums.
measures:
  - name: earned_premium
    expr: SUM(CASE WHEN component = 'EARNED' THEN amount ELSE 0 END)
    description: Premium earned to date, straight-line daily basis.
  - name: claims_incurred
    expr: SUM(CASE WHEN component = 'INCURRED' THEN amount ELSE 0 END)
    description: Paid plus outstanding net of recoveries.
  - name: expenses
    expr: SUM(CASE WHEN component = 'EXPENSE' THEN amount ELSE 0 END)
    description: Operating, acquisition and claims-handling expenses allocated to the line.
  - name: loss_ratio_earned
    expr: SUM(CASE WHEN component = 'INCURRED' THEN amount ELSE 0 END) / NULLIF(SUM(CASE WHEN component = 'EARNED' THEN amount ELSE 0 END), 0)
    description: Claims incurred over earned premium.
  - name: expense_ratio
    expr: SUM(CASE WHEN component = 'EXPENSE' THEN amount ELSE 0 END) / NULLIF(SUM(CASE WHEN component = 'EARNED' THEN amount ELSE 0 END), 0)
    description: Expenses over earned premium.
  - name: combined_ratio
    expr: (SUM(CASE WHEN component = 'INCURRED' THEN amount ELSE 0 END) + SUM(CASE WHEN component = 'EXPENSE' THEN amount ELSE 0 END)) / NULLIF(SUM(CASE WHEN component = 'EARNED' THEN amount ELSE 0 END), 0)
    description: Loss ratio plus expense ratio; below 1.0 is an underwriting profit.
