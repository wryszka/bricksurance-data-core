kind: metric_view
name: underwriting_metrics
domain: semantics
title: Underwriting Metrics
description: >
  Certified underwriting KPIs - premium, claims development and loss ratio -
  defined once over the canonical model. Measures are in original transaction
  currency: always group by or filter on currency_code before summing money.
  Query measures with MEASURE(name).
owner: Chief Underwriting Officer
certification: certified
source: semantics.financial_transaction
joins:
  - name: line_of_business
    source: reference.line_of_business
    condition: source.line_of_business_code = line_of_business.line_of_business_code
dimensions:
  - name: underwriting_year
    expr: underwriting_year
    description: Underwriting year of account of the underlying policy.
  - name: line_of_business
    expr: line_of_business.label
    description: >
      Line of business as its business label, e.g. 'Commercial Property'.
      Filter this dimension with labels; use line_of_business_code for codes.
  - name: line_of_business_code
    expr: source.line_of_business_code
    description: Line of business as its code, e.g. COMMERCIAL_PROPERTY.
  - name: currency_code
    expr: currency_code
    description: Original currency of the transaction. Group by this before summing money.
  - name: transaction_month
    expr: DATE_TRUNC('MONTH', transaction_date)
    description: Calendar month the movement was booked in.
  - name: cause_of_loss_code
    expr: cause_of_loss_code
    description: Cause of loss for claim movements; empty for premium movements.
measures:
  - name: gross_written_premium
    expr: SUM(CASE WHEN transaction_kind = 'PREMIUM' THEN amount ELSE 0 END)
    description: >
      Sum of all premium movements (written, adjustments, returns) - the
      book's gross written premium in original currency.
  - name: claims_paid
    expr: SUM(CASE WHEN transaction_type_code IN ('INDEMNITY_PAYMENT', 'EXPENSE_PAYMENT') THEN amount ELSE 0 END)
    description: Indemnity plus allocated expense paid, gross of recoveries.
  - name: recoveries
    expr: SUM(CASE WHEN transaction_type_code = 'RECOVERY' THEN amount ELSE 0 END)
    description: Subrogation, salvage and contribution recoveries (negative amounts).
  - name: outstanding_reserve
    expr: SUM(CASE WHEN transaction_type_code = 'CASE_RESERVE_MOVEMENT' THEN amount ELSE 0 END)
    description: Current case reserves - the sum of all signed reserve movements.
  - name: claims_incurred
    expr: SUM(CASE WHEN transaction_kind = 'CLAIM' THEN amount ELSE 0 END)
    description: Paid plus outstanding net of recoveries - total claims incurred.
  - name: loss_ratio_written
    expr: SUM(CASE WHEN transaction_kind = 'CLAIM' THEN amount ELSE 0 END) / NULLIF(SUM(CASE WHEN transaction_kind = 'PREMIUM' THEN amount ELSE 0 END), 0)
    description: >
      Written-basis loss ratio: claims incurred over gross WRITTEN premium -
      the quick operational view, before premium is earned. The canonical,
      earned-basis loss ratio is performance_metrics.loss_ratio. Meaningful
      within a single currency and only over a cohort (underwriting year or
      the whole book) - never by calendar month, where premium and claims are
      out of phase.
  - name: policy_count
    expr: COUNT(DISTINCT CASE WHEN transaction_kind = 'PREMIUM' THEN policy_id END)
    description: Number of distinct policies with premium activity.
  - name: claim_count
    expr: COUNT(DISTINCT claim_id)
    description: Number of distinct claims with financial activity.
