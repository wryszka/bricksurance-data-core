kind: metric_view
name: asset_metrics
domain: semantics
title: Asset Metrics
description: >
  Asset-side KPIs over the latest positions - market value, book value and the
  rating mix by portfolio and instrument type. Portfolio duration and stress are
  governed functions (fn_duration, fn_stress_mv), not measures. Amounts are in
  original currency; group by or filter on currency_code before summing money.
  Query measures with MEASURE(name).
owner: Chief Investment Officer
certification: draft
source: investment.position
joins:
  - name: instrument
    source: investment.instrument
    condition: source.instrument_id = instrument.instrument_id
dimensions:
  - name: portfolio_code
    expr: source.portfolio_code
    description: Asset portfolio.
  - name: instrument_type_code
    expr: instrument.instrument_type_code
    description: Kind of instrument.
  - name: credit_rating_code
    expr: instrument.credit_rating_code
    description: Credit quality banding.
  - name: as_of_month
    expr: source.as_of_month
    description: Month-end the position is struck at. Filter to the latest for a point-in-time view.
  - name: currency_code
    expr: source.currency_code
    description: Currency of the values. Group by this before summing money.
measures:
  - name: asset_market_value
    expr: SUM(market_value)
    description: Market value of holdings, in original currency.
  - name: asset_book_value
    expr: SUM(book_value)
    description: Amortised book value of holdings, in original currency.
  - name: position_count
    expr: COUNT(position_id)
    description: Number of positions.
