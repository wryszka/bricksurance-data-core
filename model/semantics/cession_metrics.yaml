kind: metric_view
name: cession_metrics
domain: semantics
title: Cession Metrics
description: >
  Outward reinsurance KPIs over the cession bordereau: gross and ceded
  premium by treaty and period. Amounts are in original transaction currency;
  group by or filter on currency_code before summing money. Query measures
  with MEASURE(name).
source: exchange.cession_bordereau_line
joins:
  - name: line_of_business
    source: reference.line_of_business
    condition: source.line_of_business_code = line_of_business.line_of_business_code
dimensions:
  - name: treaty_reference
    expr: treaty_reference
    description: Treaty the premium is ceded to.
  - name: reporting_month
    expr: reporting_month
    description: Bordereau reporting month.
  - name: line_of_business
    expr: line_of_business.label
    description: >
      Line of business as its business label, e.g. 'Commercial Property'.
      Filter with labels; use line_of_business_code for codes.
  - name: line_of_business_code
    expr: source.line_of_business_code
    description: Line of business as its code, e.g. COMMERCIAL_PROPERTY.
  - name: currency_code
    expr: currency_code
    description: Original currency of the amounts. Group by this before summing money.
measures:
  - name: gross_premium
    expr: SUM(gross_premium)
    description: Gross premium on the ceded policies, in original currency.
  - name: ceded_premium
    expr: SUM(ceded_premium)
    description: Premium ceded to reinsurers, in original currency.
  - name: average_ceded_share
    expr: SUM(ceded_premium) / NULLIF(SUM(gross_premium), 0)
    description: Effective ceded share - ceded premium over gross premium.
  - name: ceded_policy_count
    expr: COUNT(DISTINCT policy_number)
    description: Number of distinct policies with ceded premium.
