kind: entity
name: consent
domain: party
title: Consent
description: >
  A data subject's consent for a processing purpose. Withdrawal is a state
  change with a timestamp, never a deletion - the consent history is itself
  evidence.
grain: One row per party per purpose per consent grant.
tags:
  maturity: draft
attributes:
  - name: consent_id
    type: string
    required: true
    description: Identifier for the consent record.
    classification: internal
  - name: party_id
    references: party
    type: string
    required: true
    description: The consenting data subject.
    classification: internal
  - name: consent_purpose_code
    code_set: consent_purpose
    required: true
    description: Purpose consented to.
  - name: consent_status_code
    code_set: consent_status
    required: true
    description: Current state of the consent.
  - name: granted_at
    type: timestamp
    required: true
    description: When consent was given.
  - name: withdrawn_at
    type: timestamp
    required: false
    description: When consent was withdrawn, where it was.
  - name: channel_code
    code_set: distribution_channel
    required: false
    description: Channel the consent was captured through.
keys:
  primary: [consent_id]
