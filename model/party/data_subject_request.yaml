kind: entity
name: data_subject_request
domain: party
title: Data Subject Request
description: >
  A GDPR data subject request (access, erasure, rectification, portability)
  tracked against the statutory clock. Erasure execution follows the design
  in PRIVACY.md.
grain: One row per request received.
tags:
  maturity: draft
attributes:
  - name: data_subject_request_id
    type: string
    required: true
    description: Identifier for the request.
    classification: internal
  - name: party_id
    references: party
    type: string
    required: true
    description: The requesting data subject.
    classification: internal
  - name: dsr_type_code
    code_set: dsr_type
    required: true
    description: Kind of request.
  - name: dsr_status_code
    code_set: dsr_status
    required: true
    description: Handling status.
  - name: received_date
    type: date
    required: true
    description: Date received; the statutory window starts here.
  - name: completed_date
    type: date
    required: false
    description: Date fulfilled or refused.
  - name: notes
    type: string
    required: false
    description: Handling notes, including refusal grounds where applicable.
    classification: confidential
keys:
  primary: [data_subject_request_id]
quality:
  - name: completed_after_received
    rule: completed_date >= received_date
    description: A request cannot complete before it is received.
