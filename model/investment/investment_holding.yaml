kind: entity
name: investment_holding
domain: investment
title: Investment Holding
description: >
  An investment asset held by a legal entity - the asset side of the balance
  sheet. Book cost and market value are carried here; income and revaluations
  are transactional. Without this domain there is no balance sheet and no
  asset-liability conversation.
grain: One row per holding per legal entity.
tags:
  maturity: draft
attributes:
  - name: investment_holding_id
    type: string
    required: true
    description: Identifier for the holding.
    classification: internal
  - name: legal_entity_id
    references: legal_entity
    type: string
    required: true
    description: The entity that owns the asset.
    classification: internal
  - name: asset_class_code
    code_set: asset_class
    required: true
    description: Asset class of the holding.
  - name: instrument_name
    type: string
    required: true
    description: Name or description of the instrument.
  - name: isin
    type: string
    required: false
    description: ISIN where the instrument is a listed security.
  - name: book_cost
    type: decimal(18,2)
    required: true
    description: Acquisition cost in the entity's functional currency.
    classification: confidential
  - name: market_value
    type: decimal(18,2)
    required: true
    description: Current market value in the entity's functional currency.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amounts.
  - name: valuation_date
    type: date
    required: true
    description: Date the market value was struck.
  - name: source_system_code
    code_set: source_system
    required: true
    description: System of record (typically an investment/custody system).
    classification: internal
keys:
  primary: [investment_holding_id]
