kind: function
name: fn_duration
domain: investment
description: >
  Cashflow-weighted mean time to cashflow (a stylised Macaulay duration, in years)
  for a portfolio, derived live from asset cashflows weighted by the nominal held
  in the latest positions. Standard-formula grade and labelled as such - not a
  discounted-yield duration. Feeds duration gap and interest stress.
inputs:
  - name: in_portfolio_code
    type: string
    description: Portfolio to measure, e.g. ANNUITY_MA.
returns:
  type: decimal(10,4)
  description: Weighted mean years to cashflow; 0 if the portfolio has no future cashflows.
sql: |
  (SELECT CAST(COALESCE(
     SUM((datediff(ac.cashflow_month, current_date()) / 365.0)
         * (COALESCE(ac.coupon_amount,0) + COALESCE(ac.redemption_amount,0)) * pos.nominal)
     / NULLIF(SUM((COALESCE(ac.coupon_amount,0) + COALESCE(ac.redemption_amount,0)) * pos.nominal), 0), 0)
     AS DECIMAL(10,4))
   FROM {investment.asset_cashflow} ac
   JOIN (SELECT instrument_id, nominal FROM {investment.position} p
         WHERE p.portfolio_code = in_portfolio_code
           AND p.as_of_month = (SELECT MAX(as_of_month) FROM {investment.position}
                                WHERE portfolio_code = in_portfolio_code)) pos
     ON pos.instrument_id = ac.instrument_id
   WHERE ac.cashflow_month > current_date())
