kind: entity
name: bordereau_claim_row
domain: delegated_authority
title: Bordereau Claim Row
description: >
  A claim movement on a claims bordereau, mapped to Lloyd's CDR claims fields.
grain: One row per claim movement per claims bordereau.
standards:
  lloyds_cdr: Claims bordereau row (CDR v3.x)
tags:
  maturity: draft
crosswalk_status: mapped
attributes:
  - name: bordereau_claim_row_id
    type: string
    required: true
    description: Identifier for the claim row.
    classification: internal
  - name: submission_id
    references: bordereau_submission
    type: string
    required: true
    description: The claims bordereau this row belongs to.
    classification: internal
  - name: risk_reference
    type: string
    required: true
    description: Risk reference the claim relates to.
    classification: confidential
    standards:
      lloyds_cdr: Risk Reference
  - name: claim_reference
    type: string
    required: true
    description: Coverholder's claim reference.
    classification: confidential
    standards:
      lloyds_cdr: Claim Reference
  - name: cause_of_loss_code
    code_set: cause_of_loss
    required: false
    description: Peril / cause of loss.
    classification: internal
    standards:
      lloyds_cdr: Cause of Loss
  - name: loss_date
    type: date
    required: false
    description: Date of loss.
    classification: internal
    standards:
      lloyds_cdr: Date of Loss
  - name: paid_amount
    type: decimal(18,2)
    required: false
    description: Amount paid in the period.
    classification: confidential
    standards:
      lloyds_cdr: Paid This Period
  - name: outstanding_amount
    type: decimal(18,2)
    required: false
    description: Outstanding reserve at period end.
    classification: confidential
    standards:
      lloyds_cdr: Outstanding Reserve
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amounts.
    classification: internal
    standards:
      lloyds_cdr: Original Currency
keys:
  primary: [bordereau_claim_row_id]
owner: Head of Delegated Authority
