kind: view
name: vw_authority_breach
domain: delegated_authority
title: Authority Breach (live detection)
description: >
  Live detection of line-size and line-of-business breaches on bordereau risk rows,
  computed by comparing each risk against its binder's limits - no stored state. The
  governed authority_breach table records the tracked/waived ones; this view is the
  always-current detector behind "which coverholders are outside authority right now".
grain: One row per breaching risk row per breach type.
sql: |
  SELECT
    r.bordereau_risk_row_id,
    b.binder_id,
    b.umr,
    'LINE_SIZE' AS breach_type_code,
    r.sum_insured AS observed_value,
    b.max_line_size AS limit_value
  FROM {delegated_authority.bordereau_risk_row} r
  JOIN {delegated_authority.bordereau_submission} s ON s.submission_id = r.submission_id
  JOIN {delegated_authority.binding_authority} b ON b.binder_id = s.binder_id
  WHERE b.max_line_size IS NOT NULL AND r.sum_insured > b.max_line_size
  UNION ALL
  SELECT
    r.bordereau_risk_row_id,
    b.binder_id,
    b.umr,
    'LOB' AS breach_type_code,
    NULL AS observed_value,
    NULL AS limit_value
  FROM {delegated_authority.bordereau_risk_row} r
  JOIN {delegated_authority.bordereau_submission} s ON s.submission_id = r.submission_id
  JOIN {delegated_authority.binding_authority} b ON b.binder_id = s.binder_id
  WHERE NOT EXISTS (
    SELECT 1 FROM {delegated_authority.binding_authority_lob} bl
    WHERE bl.binder_id = b.binder_id AND bl.line_of_business_code = r.line_of_business_code
  )
