kind: entity
name: bordereau_risk_row
domain: delegated_authority
title: Bordereau Risk Row
description: >
  A single risk on a risk bordereau, mapped attribute-by-attribute to Lloyd's Core
  Data Record fields. Risk rows enter the same policy event spine (a BOUND event with
  source BORDEREAU), so delegated business is one twin, not a side door.
grain: One row per risk per risk bordereau.
standards:
  lloyds_cdr: Risk bordereau row (CDR v3.x)
tags:
  maturity: draft
crosswalk_status: mapped
attributes:
  - name: bordereau_risk_row_id
    type: string
    required: true
    description: Identifier for the risk row.
    classification: internal
  - name: submission_id
    references: bordereau_submission
    type: string
    required: true
    description: The risk bordereau this row belongs to.
    classification: internal
  - name: policy_id
    references: policy
    type: string
    required: false
    description: The policy this risk was bound as in the spine (delegated business).
    classification: internal
  - name: risk_reference
    type: string
    required: true
    description: Coverholder's risk reference.
    classification: confidential
    standards:
      lloyds_cdr: Unique Market Reference / Risk Reference
  - name: insured_name
    type: string
    required: false
    description: Name of the insured.
    classification: pii
    standards:
      lloyds_cdr: Insured/Reinsured Full Name
  - name: line_of_business_code
    code_set: line_of_business
    required: true
    description: Line of business of the risk.
    classification: internal
    standards:
      lloyds_cdr: Class of Business
  - name: risk_inception_date
    type: date
    required: true
    description: Inception date of the risk.
    classification: internal
    standards:
      lloyds_cdr: Inception Date
  - name: risk_expiry_date
    type: date
    required: true
    description: Expiry date of the risk.
    classification: internal
    standards:
      lloyds_cdr: Expiry Date
  - name: risk_country_code
    code_set: country
    required: false
    description: Country the risk is located in.
    classification: internal
    standards:
      lloyds_cdr: Location of Risk - Country
  - name: postcode
    type: string
    required: false
    description: Risk location postcode.
    classification: confidential
    standards:
      lloyds_cdr: Location of Risk - Postcode
  - name: sum_insured
    type: decimal(18,2)
    required: false
    description: Sum insured / limit for the risk.
    classification: confidential
    standards:
      lloyds_cdr: Sum Insured / Limit
  - name: gross_premium
    type: decimal(18,2)
    required: false
    description: Gross written premium for the risk.
    classification: confidential
    standards:
      lloyds_cdr: Gross Premium
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amounts.
    classification: internal
    standards:
      lloyds_cdr: Original Currency
keys:
  primary: [bordereau_risk_row_id]
owner: Head of Delegated Authority
