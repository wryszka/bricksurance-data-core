kind: code_set
name: quote_status
title: Quote Status
description: >
  Lifecycle status of a quotation. A quote that converts is linked to the
  resulting policy; premium only ever arises on the policy, never the quote.
standards:
  acord: QuoteStatusCd
codes:
  - code: OPEN
    label: Open
    description: Quotation requested and being worked.
  - code: OFFERED
    label: Offered
    description: Terms offered to the prospective policyholder.
  - code: CONVERTED
    label: Converted
    description: Offer accepted; a policy has been issued from this quote.
  - code: DECLINED_BY_INSURER
    label: Declined by Insurer
    description: The insurer declined to offer terms.
  - code: REJECTED_BY_CUSTOMER
    label: Rejected by Customer
    description: Terms offered but not taken up.
  - code: EXPIRED
    label: Expired
    description: Offer lapsed unanswered at its validity date.
