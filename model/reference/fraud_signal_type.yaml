kind: code_set
name: fraud_signal_type
title: Fraud Signal Type
description: >
  Kinds of fraud indicator on a claim. Signals inform investigation; they
  never auto-decide.
codes:
  - code: LATE_REPORTING
    label: Late Reporting
    description: Unusual delay between loss and notification.
  - code: PRIOR_CLAIMS
    label: Prior Claims Pattern
    description: Elevated recent claims frequency for the party.
  - code: VELOCITY
    label: Velocity
    description: Multiple claims or policies opened in a short window.
  - code: DOC_INCONSISTENCY
    label: Document Inconsistency
    description: Evidence contradicts the reported circumstances.
  - code: NETWORK_LINK
    label: Network Link
    description: Link to parties or addresses seen in confirmed fraud.
