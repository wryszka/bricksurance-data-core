kind: code_set
name: distribution_channel
title: Distribution Channel
description: >
  How business reaches the insurer. Machine channels are first-class: an
  agentic buyer is a channel, not an exception.
codes:
  - code: DIRECT
    label: Direct
    description: Sold directly by the insurer to the customer.
  - code: BROKER
    label: Broker
    description: Placed by an intermediary acting for the customer.
  - code: AGGREGATOR
    label: Aggregator
    description: Price-comparison platform distribution.
  - code: COVERHOLDER
    label: Coverholder
    description: Bound under delegated authority.
  - code: MACHINE_AGENT
    label: Machine Agent
    description: Requested and negotiated by an autonomous software agent acting for the buyer.
