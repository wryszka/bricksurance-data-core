kind: code_set
name: dsr_status
title: Data Subject Request Status
description: Handling status of a data subject request against the statutory clock.
codes:
  - code: RECEIVED
    label: Received
    description: Logged; statutory response window running.
  - code: IN_PROGRESS
    label: In Progress
    description: Being fulfilled.
  - code: COMPLETED
    label: Completed
    description: Fulfilled and evidenced.
  - code: REFUSED
    label: Refused
    description: Refused with grounds (e.g. legal obligation to retain).
