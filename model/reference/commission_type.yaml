kind: code_set
name: commission_type
title: Commission Type
description: >
  Kinds of intermediary remuneration. Commission is transactional - signed
  movements, never overwritten balances - and disclosable by design.
codes:
  - code: NEW_BUSINESS
    label: New Business Commission
    description: Commission on newly written business.
  - code: RENEWAL
    label: Renewal Commission
    description: Commission on renewed business.
  - code: PROFIT
    label: Profit Commission
    description: Contingent commission based on account performance.
  - code: CLAWBACK
    label: Clawback
    description: Commission returned on cancellation or lapse; negative amount.
