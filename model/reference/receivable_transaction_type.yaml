kind: code_set
name: receivable_transaction_type
title: Receivable Transaction Type
description: >
  Premium billing movements. Outstanding debt is the signed sum - invoices
  positive, cash negative - never a stored balance.
codes:
  - code: INVOICE
    label: Invoice
    description: Premium invoiced to the payer; positive.
  - code: CASH_RECEIPT
    label: Cash Receipt
    description: Premium cash received; negative.
  - code: WRITE_OFF
    label: Write-off
    description: Irrecoverable balance written off; negative.
  - code: REFUND
    label: Refund
    description: Premium refunded to the payer; positive.
