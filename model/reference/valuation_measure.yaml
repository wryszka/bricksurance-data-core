kind: code_set
name: valuation_measure
title: Valuation Measure
description: >
  Financial measures produced by valuation processes across regimes. One code
  set serves life and non-life, Solvency II and IFRS 17: a measure is a
  defined quantity, and new regimes add codes, not tables.
standards:
  lloyds_cdr: n/a — regime measures per Solvency II / IFRS 17 definitions
codes:
  - code: BEL
    label: Best Estimate Liability
    description: Present value of expected future cash flows, Solvency II best estimate.
  - code: RISK_MARGIN
    label: Risk Margin
    description: Solvency II risk margin over the best estimate.
  - code: TECHNICAL_PROVISION
    label: Technical Provision
    description: Best estimate plus risk margin.
  - code: CASE_RESERVE_TOTAL
    label: Case Reserves (Total)
    description: Sum of open case reserves at the valuation date.
  - code: IBNR
    label: IBNR
    description: Incurred-but-not-reported reserve at the valuation date.
  - code: SCR
    label: Solvency Capital Requirement
    description: Solvency II capital requirement.
  - code: OWN_FUNDS
    label: Own Funds
    description: Eligible own funds at the valuation date.
  - code: CSM
    label: Contractual Service Margin
    description: IFRS 17 contractual service margin.
  - code: RISK_ADJUSTMENT
    label: Risk Adjustment
    description: IFRS 17 risk adjustment for non-financial risk.
  - code: MCR
    label: Minimum Capital Requirement
    description: Solvency II minimum capital requirement.
  - code: ELIGIBLE_OWN_FUNDS_T1
    label: Eligible Own Funds - Tier 1
    description: Tier 1 eligible own funds under Solvency II.
  - code: SCR_COVERAGE_RATIO
    label: SCR Coverage Ratio
    description: Eligible own funds over SCR, expressed as a ratio.
  - code: LRC
    label: Liability for Remaining Coverage
    description: IFRS 17 liability for remaining coverage.
  - code: LIC
    label: Liability for Incurred Claims
    description: IFRS 17 liability for incurred claims.
  - code: DAC
    label: Deferred Acquisition Costs
    description: Acquisition costs deferred and amortised over the cover period.
  - code: UPR
    label: Unearned Premium Reserve
    description: Premium received but not yet earned.
