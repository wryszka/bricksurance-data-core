kind: code_set
name: insured_object_type
title: Insured Object Type
description: >
  Kinds of object or exposure a policy can insure. Extend with new codes as
  new lines of business are written (vessels, livestock, cyber estates...).
standards:
  acord: InsuredObject / Risk patterns of the ACORD Information Model
codes:
  - code: BUILDING
    label: Building
    description: A building or fixed structure at a defined location.
  - code: VEHICLE
    label: Vehicle
    description: A road vehicle.
  - code: CARGO_SHIPMENT
    label: Cargo Shipment
    description: A defined consignment of goods in transit.
  - code: LIABILITY_EXPOSURE
    label: Liability Exposure
    description: >
      An abstract exposure unit for liability covers, such as a set of
      business operations at a location.
