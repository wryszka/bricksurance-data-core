kind: code_set
name: source_system
title: Source System
description: >
  Systems of record that feed the data layer. Provenance is part of the model:
  every core entity carries a source_system_code, and identifiers are only
  unique within their source system.
codes:
  - code: PAS_CORE
    label: Policy Administration (Core)
    description: The group's core policy administration system.
  - code: CLM_CORE
    label: Claims (Core)
    description: The group's core claims management system.
  - code: RI_CORE
    label: Reinsurance (Core)
    description: The group's reinsurance administration system.
  - code: DATA_CORE
    label: Data Core (Mastered)
    description: >
      Records mastered or derived inside the data layer itself, such as
      deduplicated golden party records.
  - code: LIFE_CORE
    label: Life Administration (Core)
    description: The group's life policy administration and valuation feed.
  - code: COVERHOLDER_BDX
    label: Coverholder Bordereau
    description: >
      Lines reported by coverholders or brokers via bordereaux and mapped
      into the canonical model through the exchange domain.
  - code: COMPANY_DATA_PROVIDER
    label: External Company Data Provider
    description: >
      Third-party business information (Dun & Bradstreet-style) matched to our
      commercial parties by a global company identifier. Synthetic in this demo.
  - code: PAS_MOTOR
    label: Motor policy administration
    description: The motor book's policy administration system (extract schema src_pas).
  - code: CLM_MOTOR
    label: Motor claims management
    description: The motor book's claims management system (extract schema src_claims).
  - code: ACT_DW
    label: Actuarial warehouse
    description: The actuarial data warehouse (earning engine output, IBNR, pricing dimensions; extract schema src_actuarial).
