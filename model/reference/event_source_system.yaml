kind: code_set
name: event_source_system
title: Event Source System
description: >
  Where a policy lifecycle event originated - the channel or system that raised
  it. Distinct from source_system (system of record for a row); this names the
  actor's channel so delegated and agentic business is visible in the spine.
codes:
  - code: UW_WORKBENCH
    label: Underwriting Workbench
    description: Raised by the underwriting workbench.
  - code: PORTAL
    label: Customer Portal
    description: Raised through a self-service customer portal.
  - code: BROKER_MCP
    label: Broker (MCP)
    description: Raised by a broker via the machine interface.
  - code: BORDEREAU
    label: Bordereau
    description: Raised from a delegated-authority bordereau submission.
  - code: BATCH
    label: Batch
    description: Raised by a scheduled batch process (e.g. renewals, expiries).
  - code: MIGRATION
    label: Migration
    description: Back-generated when the event spine was first populated from history.
