kind: function
name: fn_define
domain: reference
description: >
  Looks a business term up in the data dictionary - the model explaining
  itself to humans and agents alike.
inputs:
  - name: in_term
    type: string
    description: An entity or attribute name, e.g. loss_ratio or claim.
returns:
  type: string
  description: Up to three matching definitions, '||'-separated; NULL when unknown.
sql: |
  (SELECT array_join(slice(sort_array(collect_list(
            concat(entity_name, '.', attribute_name, ': ', definition))), 1, 3), ' || ')
   FROM {reference.data_dictionary}
   WHERE lower(attribute_name) = lower(in_term) OR lower(entity_name) = lower(in_term))
