name: dsr_type
title: Data Subject Request Type
description: GDPR data subject request kinds.
codes:
  - code: ACCESS
    label: Access (DSAR)
    description: Right of access to personal data held.
  - code: ERASURE
    label: Erasure
    description: Right to erasure, applied per the model's erasure design.
  - code: RECTIFICATION
