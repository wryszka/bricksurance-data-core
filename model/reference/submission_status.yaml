kind: code_set
name: submission_status
title: Submission Status
description: >
  Lifecycle of a reinsurance submission from receipt to bind or decline.
standards:
  acord: Placement / submission patterns (ACORD GRLC)
codes:
  - code: RECEIVED
    label: Received
    description: Submission received and awaiting triage.
  - code: IN_REVIEW
    label: In Review
    description: Under triage, pricing and accumulation assessment.
  - code: QUOTED
    label: Quoted
    description: Terms quoted back to the cedant or broker.
  - code: BOUND
    label: Bound
    description: Accepted and bound; a treaty exists for this submission.
  - code: DECLINED
    label: Declined
    description: Declined by the reinsurer.
  - code: WITHDRAWN
    label: Withdrawn
    description: Withdrawn by the cedant or broker before a decision.
