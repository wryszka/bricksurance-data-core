kind: entity
name: claim_transaction
domain: claim
title: Claim Transaction
description: >
  A signed financial movement on a claim: case reserve movements, indemnity
  and expense payments, and recoveries. Outstanding, paid and incurred are
  always derived by summation over these movements, never stored as balances.
grain: One row per financial movement per claim.
standards:
  acord: Claim payment / reserve patterns of the ACORD Information Model
tags:
  maturity: certified
attributes:
  - name: claim_transaction_id
    type: string
    required: true
    description: Identifier for the claim transaction.
    classification: internal
  - name: claim_id
    references: claim
    type: string
    required: true
    description: Claim the movement belongs to.
    classification: internal
  - name: claim_transaction_type_code
    code_set: claim_transaction_type
    required: true
    description: Kind of financial movement.
    classification: internal
  - name: amount
    type: decimal(18,2)
    required: true
    description: >
      Signed amount in the transaction currency. Reserve increases positive,
      reserve releases negative; payments positive; recoveries negative from
      the insurer's cost perspective.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amount.
    classification: internal
  - name: transaction_date
    type: date
    required: true
    description: Date the movement was booked.
    classification: internal
  - name: source_system_code
    code_set: source_system
    required: true
    description: System of record the movement originates from.
    classification: internal
keys:
  primary: [claim_transaction_id]
owner: Chief Claims Officer
