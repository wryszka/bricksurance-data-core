kind: entity
name: vehicle
domain: policy
title: Vehicle
description: >
  Motor-specific detail for an insured object of type VEHICLE. This is the
  model's typed-satellite pattern: the generic insured_object stays lean, and
  object types that need depth get a satellite entity - vessels, buildings
  surveys or cyber estates would follow the same shape.
grain: One row per vehicle per insured object.
standards:
  acord: Vehicle (ACORD Information Model, personal/commercial auto)
tags:
  maturity: draft
attributes:
  - name: vehicle_id
    type: string
    required: true
    description: Identifier for the vehicle record.
    classification: internal
  - name: insured_object_id
    references: insured_object
    type: string
    required: true
    description: The insured object this vehicle detail belongs to (object type VEHICLE).
    classification: internal
  - name: registration_number
    type: string
    required: false
    description: Vehicle registration mark.
    classification: pii
    standards:
      acord: VehIdentificationNumber / registration
  - name: make
    type: string
    required: false
    description: Manufacturer.
    classification: internal
  - name: model
    type: string
    required: false
    description: Model designation.
    classification: internal
  - name: year_of_manufacture
    type: integer
    required: false
    description: Year of manufacture.
    classification: internal
keys:
  primary: [vehicle_id]
owner: Chief Underwriting Officer
