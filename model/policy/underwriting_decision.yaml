kind: entity
name: underwriting_decision
domain: policy
title: Underwriting Decision
description: >
  A recorded underwriting decision on a quote: the outcome, who or what
  decided (human underwriter or named agent), and the appetite rule applied.
  Machine decisions are audited to exactly the same standard as human ones -
  that is the condition for letting agents underwrite at all.
grain: One row per decision per quote.
tags:
  maturity: draft
attributes:
  - name: underwriting_decision_id
    type: string
    required: true
    description: Identifier for the decision.
    classification: internal
  - name: quote_id
    references: quote
    type: string
    required: true
    description: The quote decided on.
    classification: internal
  - name: underwriting_decision_type_code
    code_set: underwriting_decision_type
    required: true
    description: The outcome.
  - name: appetite_rule_id
    references: appetite_rule
    type: string
    required: false
    description: The appetite rule the decision applied, where rule-driven.
    classification: internal
  - name: decided_by
    type: string
    required: true
    description: The human underwriter or named agent/system that decided.
    classification: internal
  - name: decided_by_agent
    type: boolean
    required: true
    description: True when the decision was taken autonomously by software.
  - name: decided_at
    type: timestamp
    required: true
    description: When the decision was taken.
  - name: rationale
    type: string
    required: false
    description: Free-text rationale, human- or agent-written.
    classification: confidential
keys:
  primary: [underwriting_decision_id]
