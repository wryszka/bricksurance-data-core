kind: entity
name: insured_object
domain: policy
title: Insured Object
description: >
  A concrete object or exposure insured under a policy - a building, a
  vehicle, a shipment, a set of operations. Location lives here, which makes
  this the anchor for exposure and accumulation analysis.
grain: One row per insured object under a policy.
standards:
  acord: InsuredObject / Risk (ACORD Information Model)
tags:
  maturity: draft
attributes:
  - name: insured_object_id
    type: string
    required: true
    description: Identifier for the insured object.
    classification: internal
  - name: policy_id
    references: policy
    type: string
    required: true
    description: Policy the object is insured under.
    classification: internal
  - name: insured_object_type_code
    code_set: insured_object_type
    required: true
    description: Kind of object or exposure insured.
    classification: internal
  - name: description
    type: string
    required: false
    description: Human-readable description of the object, as declared.
    classification: confidential
  - name: country_code
    code_set: country
    required: true
    description: Country where the object is located or the exposure arises.
    classification: internal
  - name: postcode
    type: string
    required: false
    description: Postal code of the object's location, where applicable; drives geographic accumulation.
    classification: confidential
    standards:
      lloyds_cdr: Risk location
  - name: latitude
    type: decimal(9,6)
    required: false
    description: Latitude of the object's location, where geocoded.
    classification: confidential
  - name: longitude
    type: decimal(9,6)
    required: false
    description: Longitude of the object's location, where geocoded.
    classification: confidential
keys:
  primary: [insured_object_id]
owner: Chief Underwriting Officer
