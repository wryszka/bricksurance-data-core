kind: entity
name: premium_transaction
domain: policy
title: Premium Transaction
description: >
  A signed premium movement on a policy. Premium is transactional by design:
  figures such as gross written premium are derived by summing transactions,
  never stored as overwritable balances.
grain: One row per premium movement per policy (and coverage, where known).
standards:
  acord: Premium / MoneyProvision patterns of the ACORD Information Model
  lloyds_cdr: Premium attributes (indicative)
tags:
  maturity: certified
attributes:
  - name: premium_transaction_id
    type: string
    required: true
    description: Identifier for the premium transaction.
    classification: internal
  - name: policy_id
    references: policy
    type: string
    required: true
    description: Policy the premium movement belongs to.
    classification: internal
  - name: coverage_id
    references: coverage
    type: string
    required: false
    description: Coverage the movement is allocated to, where the source provides that split.
    classification: internal
  - name: premium_transaction_type_code
    code_set: premium_transaction_type
    required: true
    description: Kind of premium movement.
    classification: internal
  - name: amount
    type: decimal(18,2)
    required: true
    description: >
      Signed amount of the movement in the transaction currency: written and
      positive adjustments positive, returns negative.
    classification: confidential
  - name: currency_code
    code_set: currency
    required: true
    description: Currency of the amount.
    classification: internal
  - name: policy_event_id
    references: policy_event
    type: string
    required: false
    description: >
      The policy lifecycle event that gave rise to this movement (WP1 spine) -
      every premium movement is caused by an event (bind, MTA, cancellation).
    classification: internal
  - name: ipt_amount
    type: decimal(18,2)
    required: false
    description: Insurance premium tax on the movement, in the transaction currency.
    classification: confidential
  - name: commission_amount
    type: decimal(18,2)
    required: false
    description: Broker commission on the movement, in the transaction currency.
    classification: confidential
  - name: commission_rate
    type: decimal(6,4)
    required: false
    description: Commission rate applied to the gross premium on this movement.
    classification: confidential
  - name: broker_party_id
    references: party
    type: string
    required: false
    description: Broker party the commission is payable to, where the business is intermediated.
    classification: internal
  - name: inception_date
    type: date
    required: false
    description: Cover start date the premium is earned from.
    classification: internal
  - name: expiry_date
    type: date
    required: false
    description: Cover end date the premium is earned to.
    classification: internal
  - name: transaction_date
    type: date
    required: true
    description: Date the movement was booked.
    classification: internal
  - name: source_system_code
    code_set: source_system
    required: true
    description: System of record the movement originates from.
    classification: internal
keys:
  primary: [premium_transaction_id]
owner: Chief Underwriting Officer
