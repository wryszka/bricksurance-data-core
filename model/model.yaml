model: bricksurance-data-core
title: Bricksurance Data Core
version: 0.14.0
description: >
  An open, business-first semantic data model for insurance, aligned to ACORD
  terminology with a crosswalk to the Lloyd's Core Data Record. Platform
  artifacts are generated from these specs; see bindings/ and tools/.
domains:
  - name: reference
    description: >
      Shared code sets and classifications used across all domains, plus the
      generated data dictionary. Reference data is versioned with the model:
      allowed values live in the specs, not in anyone's head.
  - name: org
    description: >
      The group's own legal-entity structure - the reporting hierarchy every
      other domain hangs off. Solvency II, IFRS 17 and statutory accounts all
      report at solo (subsidiary) and group (consolidated) level; this domain
      is what makes that distinction real rather than assumed.
  - name: finance
    description: >
      The finance function proper - a real double-entry general ledger
      (chart of accounts, balanced journals, accounting periods), the
      operational sub-ledgers (premium, claims, commission, expense,
      receivables), regulatory and actuarial measures (Solvency II, IFRS 17),
      financial-statement structure, budget and FX. Everything a CFO org runs on.
  - name: investment
    description: >
      The asset side of the balance sheet - investment holdings, valuations
      and income. Roughly half an insurer's balance sheet; without it there is
      no balance sheet and no ALM conversation.
  - name: party
    description: >
      People and organisations, and the roles they play in the business
      (insured, broker, cedant, reinsurer, claimant). A party exists once;
      relationships are roles.
  - name: policy
    description: >
      Insurance contracts and their composition - policies, coverages, insured
      objects and premium transactions.
  - name: claim
    description: >
      Claims against policies and their financial development - reserves,
      payments and recoveries as transactions, never as overwritten balances.
  - name: reinsurance
    description: >
      Outward and inward reinsurance - treaties, cessions and recoveries
      linking the direct book to reinsurers.
  - name: reserving
    description: >
      Actuarial reserving as a governed semantic layer over claim transactions -
      loss-development triangles, chain-ladder and Bornhuetter-Ferguson
      estimates, IBNR and ultimate losses by accident year. Triangles are
      derived by summation over claim movements, never stored; the method used
      is a recorded, attestable choice. The spreadsheet workflow, done on the
      platform: reproducible, reconciling to source, and answerable in Genie.
  - name: product
    description: >
      Machine-readable products - offered coverages, underwriting questions
      and appetite rules as data, so any channel (human, aggregator or buyer
      agent) can discover, quote and be decided against the same rules.
  - name: policy_lifecycle
    description: >
      The append-only policy administration spine - every lifecycle event of a
      policy (quote, bind, endorse, renew, lapse, cancel) as an immutable,
      hash-chained record, and the slowly-changing versions derived from it.
      This is the shared key fabric that joins underwriting to claims to finance:
      current policy state is a projection of the event stream, never a hand-edited
      table, and a claim attaches to the policy version in force at the loss.
  - name: enrichment
    description: >
      External and derived risk data joined to the canonical model - telematics,
      credit, geospatial hazard, postcode, market benchmarks, demographics and
      sanctions screening. These are third-party or derived attributes about a
      policy, party or insured object, kept as governed, classified data rather
      than scattered feature tables. Pricing and underwriting both draw on them;
      modelling them once, with data classification, is what lets those
      workbenches share risk signal instead of each re-sourcing it.
  - name: model
    description: >
      Machine-learning and analytical models as governed assets - the model,
      its versions, the features it consumes, the scores it produces and its
      monitoring metrics. The layer represents AI the way it represents data:
      every score traces to a model version, every feature to a definition and a
      classification. This is what makes model governance a first-class part of
      the semantic layer, not a side system.
  - name: pricing
    description: >
      The rating structure - factors, their levels and relativities, engine
      configurations and the derived factor contributions on a quote or policy.
      Pricing decisions become explainable data: a quoted premium decomposes into
      the factors and relativities that produced it, and the engine config cites
      the model version behind it.
  - name: renewal
    description: >
      The renewal and retention loop - each policy's renewal cycle (invitation,
      price walk, competitor reference, outcome) and the observed retention
      response by segment and price-walk band. This is where the twin manages
      business in force rather than only writing it once, and the substrate for
      the closed loop that lets a pricing decision change next period's book.
  - name: distribution
    description: >
      How business reaches the insurer - channels and intermediary
      remuneration, transactional and disclosable.
  - name: conduct
    description: >
      Fair treatment made measurable - complaints per FCA groupings, through
      to ombudsman referral and redress.
  - name: content
    description: >
      Governed unstructured content - wordings, schedules, evidence, slips -
      with extracted text searchable under the same governance as rows.
  - name: events
    description: >
      The append-only business event stream - the near-real-time face of the
      model and the feed for monitoring agents.
  - name: life
    description: >
      Life business - grouped model points, governed assumption sets,
      economic scenario sets and valuation runs. Life policies themselves are
      ordinary policies with life lines of business.
  - name: exchange
    description: >
      Canonical data-exchange objects (bordereau lines, submissions) and the
      landing zone for inbound counterparty data before mapping to the
      canonical model.
  - name: semantics
    description: >
      Business metrics defined once over the canonical model - gross written
      premium, net earned premium, incurred, loss ratio, combined ratio.
      Physicalised as metric views where the platform supports them.
