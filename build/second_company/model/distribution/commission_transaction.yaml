kind: entity
name: commission_transaction
domain: distribution
title: Commission Transaction
description: 'A signed intermediary remuneration movement on a policy. Transactional like
  all money in this model; disclosable commission is a query, not a project.

  '
grain: One row per commission movement per policy per intermediary.
tags:
  maturity: draft
attributes:
- name: commission_transaction_id
  type: string
  required: true
  description: Identifier for the movement.
  classification: internal
- name: policy_id
  references: policy
  type: string
  required: true
  description: The policy the commission relates to.
  classification: internal
- name: party_id
  references: party
  type: string
  required: true
  description: The intermediary earning (or repaying) the commission.
  classification: internal
- name: commission_type_code
  code_set: commission_type
  required: true
  description: Kind of remuneration.
- name: rate
  type: decimal(5,4)
  required: false
  description: Commission rate applied, as a fraction of premium.
  classification: confidential
- name: amount
  type: decimal(18,2)
  required: true
  description: Signed amount in the transaction currency; clawbacks negative.
  classification: confidential
- name: currency_code
  code_set: currency
  required: true
  description: Currency of the amount.
- name: transaction_date
  type: date
  required: true
  description: Date the movement was booked.
- name: source_system_code
  code_set: source_system
  required: true
  description: System of record.
  classification: internal
keys:
  primary:
  - commission_transaction_id
