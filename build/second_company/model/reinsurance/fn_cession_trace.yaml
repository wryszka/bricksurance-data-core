kind: function
name: fn_cession_trace
domain: reinsurance
description: Which treaties a policy is ceded to, and at what shares.
inputs:
- name: in_policy_number
  type: string
  description: Policy number, e.g. POL-2026-000001.
returns:
  type: string
  description: Semicolon-separated 'treaty @ share' list; NULL when nothing is ceded.
sql: "(SELECT array_join(sort_array(collect_list(\n          concat(t.treaty_reference, '\
  \ @ ', cast(ces.ceded_share AS STRING)))), '; ')\n FROM {reinsurance.cession} ces\n JOIN\
  \ {policy.policy} p ON p.policy_id = ces.policy_id\n JOIN {reinsurance.treaty} t ON t.treaty_id\
  \ = ces.treaty_id\n WHERE p.policy_number = in_policy_number)\n"
