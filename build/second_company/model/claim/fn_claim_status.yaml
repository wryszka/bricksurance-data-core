kind: function
name: fn_claim_status
domain: claim
description: One-line status of a claim - handling status, cause and loss date.
inputs:
- name: in_claim_number
  type: string
  description: Claim number, e.g. CLM-2026-000001.
returns:
  type: string
  description: status | cause | loss date, or NULL when unknown.
sql: "(SELECT max(concat(claim_status_code, ' | ', cause_of_loss_code,\n                 \
  \  ' | loss date ', cast(loss_date AS STRING)))\n FROM {claim.claim} WHERE claim_number\
  \ = in_claim_number)\n"
