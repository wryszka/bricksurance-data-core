kind: entity
name: document
domain: content
title: Document
description: 'Governed unstructured content: policy wordings, schedules, claim evidence, survey
  reports, MRC slips. The extracted text is carried in the row so LLM tools search and cite
  documents under the same classification and lineage as structured data; binary originals
  live in a Volume referenced by path.

  '
grain: One row per document version.
tags:
  maturity: draft
attributes:
- name: document_id
  type: string
  required: true
  description: Identifier for the document.
  classification: internal
- name: document_type_code
  code_set: document_type
  required: true
  description: Kind of document.
- name: title
  type: string
  required: true
  description: Document title.
- name: product_id
  references: product
  type: string
  required: false
  description: Product context (wordings attach here).
  classification: internal
- name: policy_id
  references: policy
  type: string
  required: false
  description: Policy context (schedules attach here).
  classification: internal
- name: claim_id
  references: claim
  type: string
  required: false
  description: Claim context (evidence attaches here).
  classification: internal
- name: submission_id
  references: submission
  type: string
  required: false
  description: Submission context (slips attach here).
  classification: internal
- name: extracted_text
  type: string
  required: false
  description: Full extracted text, indexed for semantic search.
  classification: confidential
- name: volume_path
  type: string
  required: false
  description: Path to the binary original in a governed Volume, where one exists.
  classification: internal
- name: created_date
  type: date
  required: true
  description: Date the document version was created.
- name: source_system_code
  code_set: source_system
  required: true
  description: System of record.
  classification: internal
keys:
  primary:
  - document_id
quality:
- name: exactly_one_context
  rule: exactly one of product_id, policy_id, claim_id, submission_id is not null
  description: A document belongs to exactly one business context.
