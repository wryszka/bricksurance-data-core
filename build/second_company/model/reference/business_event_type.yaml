kind: code_set
name: business_event_type
title: Business Event Type
description: 'Kinds of business event captured on the event stream - the near-real-time face
  of the model. Extend per domain as processes come online.

  '
codes:
- code: QUOTE_REQUESTED
  label: Quote Requested
  description: A quotation was requested through any channel.
- code: POLICY_BOUND
  label: Policy Bound
  description: Cover was bound.
- code: FNOL
  label: First Notification of Loss
  description: A loss was first notified.
- code: CLAIM_PAYMENT
  label: Claim Payment
  description: A claim payment was issued.
- code: COMPLAINT_RECEIVED
  label: Complaint Received
  description: A complaint was received.
- code: BORDEREAU_RECEIVED
  label: Bordereau Received
  description: An inbound bordereau arrived for mapping.
