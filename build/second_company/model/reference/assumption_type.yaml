kind: code_set
name: assumption_type
title: Assumption Type
description: 'Kinds of actuarial assumption governed through the assumption-set maker/checker
  process.

  '
codes:
- code: MORTALITY
  label: Mortality
  description: Mortality rates by age, typically expressed against a standard table.
- code: LAPSE
  label: Lapse
  description: Policy discontinuance rates by duration.
- code: EXPENSE
  label: Expense
  description: Per-policy and percentage expense loadings.
- code: ECONOMIC
  label: Economic
  description: Economic assumptions such as discount and inflation bases.
