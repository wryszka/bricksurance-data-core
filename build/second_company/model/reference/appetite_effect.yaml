kind: code_set
name: appetite_effect
title: Appetite Effect
description: 'What a matching appetite rule does to a risk. Appetite lives as data, not as
  code buried in a rating engine - so agents and humans read the same rules.

  '
codes:
- code: WITHIN_APPETITE
  label: Within Appetite
  description: Proceed; automatic acceptance permitted within authority limits.
- code: REFER
  label: Refer
  description: Requires human underwriter review.
- code: OUT_OF_APPETITE
  label: Out of Appetite
  description: Decline automatically.
