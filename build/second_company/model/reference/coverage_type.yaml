kind: code_set
name: coverage_type
title: Coverage Type
description: 'Kinds of cover that can be granted under a policy. A policy bundles one or more
  coverages; limits, deductibles and claims attach at coverage level.

  '
standards:
  acord: CoverageCd
codes:
- code: BUILDINGS
  label: Buildings
  description: Physical damage to buildings and fixed structures.
- code: CONTENTS
  label: Contents
  description: Physical damage to contents, stock and equipment.
- code: BUSINESS_INTERRUPTION
  label: Business Interruption
  description: Loss of income and increased cost of working following insured physical damage.
- code: MOTOR_OWN_DAMAGE
  label: Motor Own Damage
  description: Damage to the insured vehicle itself.
- code: MOTOR_TPL
  label: Motor Third-Party Liability
  description: Liability to third parties arising from use of the insured vehicle.
- code: PUBLIC_LIABILITY
  label: Public Liability
  description: Liability to third parties for injury or property damage arising from business
    operations.
- code: CARGO
  label: Cargo
  description: Loss of or damage to goods in transit.
