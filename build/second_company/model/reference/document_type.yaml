kind: code_set
name: document_type
title: Document Type
description: 'Kinds of unstructured content the model governs. Documents carry extracted text
  so LLM tools can search and cite them under the same governance as structured data.

  '
codes:
- code: POLICY_WORDING
  label: Policy Wording
  description: The contractual wording of a product, including exclusions and conditions.
- code: SCHEDULE
  label: Schedule
  description: The policy schedule issued to the policyholder.
- code: CLAIM_EVIDENCE
  label: Claim Evidence
  description: Evidence supporting a claim - reports, photographs, invoices.
- code: SURVEY_REPORT
  label: Survey Report
  description: Risk survey or loss adjuster report.
- code: MRC_SLIP
  label: MRC Slip
  description: Market Reform Contract slip for placed reinsurance business.
