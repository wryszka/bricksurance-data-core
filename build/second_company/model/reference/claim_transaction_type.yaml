kind: code_set
name: claim_transaction_type
title: Claim Transaction Type
description: 'Kinds of claim financial movement. Claims finance is transactional: case reserves,
  payments and recoveries are signed movements, and figures such as outstanding or incurred
  are always derived by summation.

  '
standards:
  acord: Claim payment / reserve patterns of the ACORD Information Model
codes:
- code: CASE_RESERVE_MOVEMENT
  label: Case Reserve Movement
  description: 'Signed change to the case reserve estimate. The current outstanding reserve
    is the sum of these movements less indemnity payments.

    '
- code: INDEMNITY_PAYMENT
  label: Indemnity Payment
  description: Payment to the claimant in settlement of the insured loss.
- code: EXPENSE_PAYMENT
  label: Expense Payment
  description: Allocated loss adjustment expense, such as legal or surveyor fees.
- code: RECOVERY
  label: Recovery
  description: Amount recovered by subrogation, salvage or contribution; negative from the
    insurer's cost perspective.
