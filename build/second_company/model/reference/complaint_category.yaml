title: Complaint Category
description: 'Root category of a customer complaint, aligned to UK FCA complaints reporting
  groupings.

  '
codes:
- code: CLAIMS_HANDLING
  label: Claims Handling
  description: Delay, declinature, settlement amount or communication during a claim.
- code: SALES_AND_ADVICE
  label: Sales & Advice
