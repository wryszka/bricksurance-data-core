model: bricksurance-data-core
title: Bricksurance Data Core
version: 0.7.0
description: An open, business-first semantic data model for insurance, aligned to ACORD terminology
  with a crosswalk to the Lloyd's Core Data Record. Platform artifacts are generated from
  these specs; see bindings/ and tools/.
domains:
- name: reference
  description: 'Shared code sets and classifications used across all domains, plus the generated
    data dictionary. Reference data is versioned with the model: allowed values live in the
    specs, not in anyone''s head.

    '
- name: party
  description: 'People and organisations, and the roles they play in the business (insured,
    broker, cedant, reinsurer, claimant). A party exists once; relationships are roles.

    '
- name: policy
  description: 'Insurance contracts and their composition - policies, coverages, insured objects
    and premium transactions.

    '
- name: claim
  description: 'Claims against policies and their financial development - reserves, payments
    and recoveries as transactions, never as overwritten balances.

    '
- name: reinsurance
  description: 'Outward and inward reinsurance - treaties, cessions and recoveries linking
    the direct book to reinsurers.

    '
- name: product
  description: 'Machine-readable products - offered coverages, underwriting questions and
    appetite rules as data, so any channel (human, aggregator or buyer agent) can discover,
    quote and be decided against the same rules.

    '
- name: distribution
  description: 'How business reaches the insurer - channels and intermediary remuneration,
    transactional and disclosable.

    '
- name: conduct
  description: 'Fair treatment made measurable - complaints per FCA groupings, through to
    ombudsman referral and redress.

    '
- name: content
  description: 'Governed unstructured content - wordings, schedules, evidence, slips - with
    extracted text searchable under the same governance as rows.

    '
- name: events
  description: 'The append-only business event stream - the near-real-time face of the model
    and the feed for monitoring agents.

    '
- name: life
  description: 'Life business - grouped model points, governed assumption sets, economic scenario
    sets and valuation runs. Life policies themselves are ordinary policies with life lines
    of business.

    '
- name: finance
  description: 'Financial and regulatory measures - valuation results across regimes (Solvency
    II, IFRS 17) and lines of business, always tied to an auditable valuation run.

    '
- name: exchange
  description: 'Canonical data-exchange objects (bordereau lines, submissions) and the landing
    zone for inbound counterparty data before mapping to the canonical model.

    '
- name: semantics
  description: 'Business metrics defined once over the canonical model - gross written premium,
    net earned premium, incurred, loss ratio, combined ratio. Physicalised as metric views
    where the platform supports them.

    '
