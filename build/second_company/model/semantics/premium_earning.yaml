kind: view
name: premium_earning
domain: semantics
title: Premium Earning
description: 'Written, earned-to-date and unearned premium per policy, on a straight-line
  daily earning basis over the cover period. Honest limits: cancellations earn to their natural
  period in this version, and earning patterns other than straight-line are a later addition.

  '
grain: One row per policy per currency with premium activity.
sql: "SELECT\n  p.policy_id,\n  p.line_of_business_code,\n  p.underwriting_year,\n  pt.currency_code,\n\
  \  CAST(SUM(pt.amount) AS DECIMAL(18,2)) AS written_premium,\n  CAST(SUM(pt.amount * LEAST(1.0,\
  \ GREATEST(0.0,\n      (datediff(LEAST(current_date(), p.expiry_date), p.inception_date)\
  \ + 1) / 365.0)))\n    AS DECIMAL(18,2)) AS earned_premium,\n  CAST(SUM(pt.amount) - SUM(pt.amount\
  \ * LEAST(1.0, GREATEST(0.0,\n      (datediff(LEAST(current_date(), p.expiry_date), p.inception_date)\
  \ + 1) / 365.0)))\n    AS DECIMAL(18,2)) AS unearned_premium\nFROM {policy.premium_transaction}\
  \ pt\nJOIN {policy.policy} p ON p.policy_id = pt.policy_id\nGROUP BY p.policy_id, p.line_of_business_code,\
  \ p.underwriting_year, pt.currency_code\n"
