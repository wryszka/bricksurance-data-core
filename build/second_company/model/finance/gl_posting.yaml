kind: entity
name: gl_posting
domain: finance
title: GL Posting
description: 'A ledger posting derived from an operational transaction - the thin, auditable
  bridge to finance. Every posting cites its source policy or claim, so ledger totals reconcile
  to operational sums by construction.

  '
grain: One row per posting per source transaction.
tags:
  maturity: draft
attributes:
- name: gl_posting_id
  type: string
  required: true
  description: Identifier for the posting.
  classification: internal
- name: journal_reference
  type: string
  required: true
  description: Journal the posting belongs to.
  classification: internal
- name: gl_account_code
  code_set: gl_account
  required: true
  description: Ledger account posted to.
- name: amount
  type: decimal(18,2)
  required: true
  description: Signed amount in the stated currency.
  classification: confidential
- name: currency_code
  code_set: currency
  required: true
  description: Currency of the amount.
- name: posting_date
  type: date
  required: true
  description: Ledger posting date.
- name: policy_id
  references: policy
  type: string
  required: false
  description: Source policy, where the posting derives from policy money.
  classification: internal
- name: claim_id
  references: claim
  type: string
  required: false
  description: Source claim, where the posting derives from claim money.
  classification: internal
- name: source_system_code
  code_set: source_system
  required: true
  description: System of record.
  classification: internal
keys:
  primary:
  - gl_posting_id
